name: Bootstrap Lean Headers

on:
  push:
    branches:
      - constructive-by-cases

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Package headers
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$(elan which lean)"
          TOOLCHAIN="$(dirname "$(dirname "$LEAN_BIN")")"
          tar -czf lean-headers.tar.gz -C "$TOOLCHAIN" include
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.0-headers
          path: lean-headers.tar.gz
          compression-level: 0
