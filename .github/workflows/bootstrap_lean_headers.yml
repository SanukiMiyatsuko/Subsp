name: Bootstrap Lean Runtime Libs

on:
  push:
    branches:
      - constructive-by-cases

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Package runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$(elan which lean)"
          TOOLCHAIN="$(dirname "$(dirname "$LEAN_BIN")")"
          cd "$TOOLCHAIN"
          find lib -maxdepth 1 -type f -print0 | tar --null -czf "$GITHUB_WORKSPACE/lean-runtime-libs.tar.gz" --files-from=-
          ls -lh "$GITHUB_WORKSPACE/lean-runtime-libs.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.0-runtime-libs
          path: lean-runtime-libs.tar.gz
          compression-level: 0
