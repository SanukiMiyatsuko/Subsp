name: Apply subst conv cleanup

on:
  push:
    branches:
      - explicit-case-elimination
    paths:
      - .github/workflows/apply_subst_conv_cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: explicit-case-elimination
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Apply locally verified patch and validate
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/substconv.patch
          git apply --check /tmp/substconv.patch
          git apply /tmp/substconv.patch
          rm .github/workflows/apply_subst_conv_cleanup.yml

          if grep -RIn --include='*.lean' -w subst Subsp; then
            echo 'subst remains' >&2
            exit 1
          fi
          if grep -RIn --include='*.lean' -w conv Subsp; then
            echo 'conv remains' >&2
            exit 1
          fi
          if grep -RIn --include='*.lean' -E '\b(simp|simpa|simp_all|dsimp|aesop|assumption|trivial|try|repeat|all_goals|any_goals|first|first_goals|solve|solve_by_elim|apply_rules|grind|decide|native_decide|bv_decide|linarith|nlinarith|ring|ring_nf|norm_num|positivity|tauto|by_cases|by_contra|split|rcases|obtain|injection|classical|noncomputable|admit)\b|Classical\.(em|choice)|<;>|exact\?|apply\?|rw\?|simp\?' Subsp; then
            echo 'another banned tactic remains' >&2
            exit 1
          fi

          lake build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Subsp .github/workflows/apply_subst_conv_cleanup.yml
          git commit -m 'Make substitution and conversion steps explicit'
          git push origin HEAD:explicit-case-elimination
