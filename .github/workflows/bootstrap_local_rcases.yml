name: Bootstrap Local Lean Rcasing Audit

on:
  push:
    branches:
      - explicit-case-elimination

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Package Lean core and source
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$(elan which lean)"
          TOOLCHAIN="$(dirname "$(dirname "$LEAN_BIN")")"
          OUT="$RUNNER_TEMP/lean-bootstrap"
          mkdir -p "$OUT"
          tar --zstd -cf "$OUT/lean-core.tar.zst" -C "$TOOLCHAIN" bin/lean bin/lake lib/lean
          split -b 180M -d -a 2 "$OUT/lean-core.tar.zst" "$OUT/lean-core.part."
          tar -czf "$OUT/subsp-src.tar.gz" --exclude=.git .
          ls -lh "$OUT"/lean-core.part.* "$OUT/subsp-src.tar.gz"
          cp "$OUT"/lean-core.part.* "$GITHUB_WORKSPACE"/
          cp "$OUT/subsp-src.tar.gz" "$GITHUB_WORKSPACE"/
      - uses: actions/upload-artifact@v4
        with:
          name: lean-core-part-00
          path: lean-core.part.00
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-core-part-01
          path: lean-core.part.01
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-core-part-02
          path: lean-core.part.02
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-core-part-03
          path: lean-core.part.03
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-core-part-04
          path: lean-core.part.04
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-core-part-05
          path: lean-core.part.05
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: subsp-src-rcases-audit
          path: subsp-src.tar.gz
          compression-level: 0
