name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build the legacy order isomorphism
        run: lake build Subsp.old.stop
      - name: Audit all legacy declarations
        run: lake env lean ProofAuditOld.lean
