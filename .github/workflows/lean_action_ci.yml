name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and audit
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build legacy stop theorem
        run: lake build Subsp.old.stop_nf_core Subsp.old.stop_ot_comp0 Subsp.old.stop
      - name: Audit legacy declarations
        run: lake env lean ProofAuditOld.lean
