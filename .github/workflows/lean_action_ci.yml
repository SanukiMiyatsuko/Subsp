name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build legacy proof helpers
        run: lake build Subsp.old.stop Subsp.old.stop_ot_comp0 Subsp.old.stop_trans_algebra Subsp.old.stop_translation_dim
      - name: Audit completed legacy helper declarations
        run: lake env lean ProofAuditOldSupport.lean
      - name: Audit complete legacy development
        run: lake env lean ProofAuditOld.lean
