name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Check the multivariable core directly
        run: lake env lean Subsp/Multivariable.lean
      - name: Build both order-isomorphism module graphs
        run: lake build Subsp.new.stop Subsp.old.stop
      - name: Audit all new declarations
        run: lake env lean ProofAuditNew.lean
      - name: Audit all legacy declarations
        run: lake env lean ProofAuditOld.lean
