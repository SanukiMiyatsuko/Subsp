name: Local Source Bootstrap

on:
  push:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package current source
        shell: bash
        run: tar --zstd -cf /tmp/subsp-current.tar.zst --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: old-stop-order-iso-current-source
          path: /tmp/subsp-current.tar.zst
          compression-level: 0
