name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build all project modules
        run: lake build subsp Subsp.old.stop Subsp.new.stop
      - name: Audit all legacy declarations
        run: lake env lean ProofAuditOld.lean
      - name: Audit all new declarations
        run: lake env lean ProofAuditNew.lean
