name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Directly typecheck target
        run: lake env lean Subsp/new/subsp.lean
      - name: Directly typecheck axiom audit
        run: lake env lean Main.lean
