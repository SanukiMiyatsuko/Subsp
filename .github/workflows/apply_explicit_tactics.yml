name: Apply explicit tactic cleanup

on:
  push:
    branches:
      - explicit-case-elimination
    paths:
      - .github/workflows/apply_explicit_tactics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: explicit-case-elimination
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Apply locally verified patch and validate
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/cleanup.patch
          git apply --check /tmp/cleanup.patch
          git apply /tmp/cleanup.patch
          rm .github/workflows/apply_explicit_tactics.yml
          if grep -RIn --include='*.lean' -E '\b(all_goals|first|injection|split)\b' Subsp; then
            echo 'targeted tactics remain' >&2
            exit 1
          fi
          lake build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Subsp .github/workflows/apply_explicit_tactics.yml
          git commit -m 'Make remaining case tactics explicit'
          git push origin HEAD:explicit-case-elimination
