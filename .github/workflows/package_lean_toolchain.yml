name: Package Lean Toolchain

on:
  push:
    branches:
      - chatgpt/old-stop-proof

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download and split Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o /tmp/lean.tar.zst https://releases.lean-lang.org/lean4/v4.34.0/lean-4.34.0-linux.tar.zst
          split -d -a 2 -b 250M /tmp/lean.tar.zst /tmp/lean-part-
          ls -lh /tmp/lean-part-*
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-00
          path: /tmp/lean-part-00
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-01
          path: /tmp/lean-part-01
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-02
          path: /tmp/lean-part-02
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-03
          path: /tmp/lean-part-03
          compression-level: 0
          if-no-files-found: ignore
